name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Lint
        run: |
          uv run ruff check
          uv run ruff format --check
          git ls-files -co --exclude-standard '*.sh' | xargs uv run shellcheck
      - name: Test
        run: uv run pytest

  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: JSON syntax
        run: git ls-files -z '*.json' | xargs -0 -n1 jq empty
      - name: Install Claude Code and Codex
        run: npm install --global @anthropic-ai/claude-code @openai/codex
      - name: Validate marketplace and plugins
        run: scripts/validate.sh

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
